name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required files and contact styling
        run: |
          test -s index.html
          test -s style.css
          grep -Fq 'href="style.css"' index.html
          grep -Fq 'class="contact-phone"' index.html
          grep -Fq '.contact-phone' style.css

